# Settings for the shared launcher (~/web/start-dev.sh). Port comes from APP_URL.
APP_LABEL="GS Construction (multi-tenant)"

# /admin here is a transparent proxy to the central admin (ss-systems :8001),
# which the launcher starts first for the whole estate.
SIBLINGS=("ss-systems:8001:SS Systems (central admin)" "jpeterson-design:8004:J. Peterson Design")

# The admin's photos-first project flow posts a whole shoot in one request.
PHP_FLAGS=(-d upload_max_filesize=50M -d post_max_size=0 -d max_file_uploads=10000)

# Public dev URL, when the tunnel config exists on this machine.
CLOUDFLARED_CONFIG="$HOME/.cloudflared/config-gsc.yml"

EXTRA_INFO() {
  # Per-tenant local URLs, printed from the sites table so a new tenant shows
  # up the day its row exists. *.localhost maps to loopback in the browser.
  php artisan tinker --execute='foreach (App\Models\Site::listAll() as $s) { printf("      %-34s %-12s %s%s", "http://".$s->devHost().":8003/", $s->slug, $s->is_active ? "" : "(in build) ", PHP_EOL); }' 2>/dev/null \
    || echo "      (tenant list unavailable: run php artisan migrate)"
  echo "      http://127.0.0.1:8003/_sites   register + path checker"
  echo "      /admin → central admin (proxied to :8001)"
}
